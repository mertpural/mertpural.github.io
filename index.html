<style>
:root{--bg:#0d1117;--gold:#d4a540;--white:#e6edf3;--dim:#aab4c2;--hint:#aab4c2;--ink:#e6edf3;--sky-top:#070b16;--sky-bot:#101a33;--tsh:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%;min-height:100dvh;overflow:hidden;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bot) 100%);color:var(--white);text-shadow:var(--tsh);
 font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;touch-action:none;
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
main{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none}
h1{margin:0;font-size:clamp(26px,5.2vw,52px);letter-spacing:-.5px;color:var(--gold)}
h1 .at{color:#8b949e}
.soon{margin:14px 0 0;font-size:clamp(16px,2.6vw,24px);color:var(--ink)}
.sub{margin:10px 0 0;font-size:clamp(12px,1.7vw,15px);color:var(--dim)}
.cur{display:inline-block;width:.5em;height:.85em;background:#3fb950;vertical-align:-.12em;margin-left:4px;animation:b 1s step-end infinite}
@keyframes b{50%{opacity:0}}
.holiday{margin:12px 0 0;font-size:clamp(13px,2vw,18px);color:var(--gold);max-width:92vw}
.links{margin-top:22px;display:flex;gap:18px;font-size:clamp(13px,1.8vw,16px)}
.links a{pointer-events:auto;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--dim);padding-bottom:1px}
.links a:hover{color:var(--gold);border-color:var(--gold)}
.hint{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--hint);pointer-events:none}
#c{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none;z-index:2}
#bub{position:fixed;z-index:3;transform:translate(-50%,-100%);background:#161b22;border:1px solid #30363d;color:var(--white);
 padding:3px 10px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
#bub.on{opacity:1}
#tools{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:4;display:flex;gap:8px}
#mute,#cam{background:#161b22;border:1px solid #30363d;color:var(--white);border-radius:10px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
#cam:hover{border-color:var(--gold)}
#mute:hover{border-color:var(--gold)}
#cnt{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:4;background:#161b22;border:1px solid #30363d;color:#ff8fb1;border-radius:10px;padding:6px 10px;font-size:14px;pointer-events:none}
@media (max-width:640px),(max-height:520px){.hint{bottom:auto;top:calc(80px + env(safe-area-inset-top));padding:0 20px;font-size:11px;line-height:1.5}}
@media (pointer:coarse){#mute,#cam{padding:10px 14px;font-size:18px}#cnt{padding:10px 14px;font-size:16px}.links{gap:26px}.links a{padding:10px 4px}}
#pol{position:fixed;inset:0;z-index:10;background:rgba(5,8,14,.74);display:flex;align-items:center;justify-content:center;padding:20px;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#pol[hidden]{display:none}
#polx{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:10px;padding:8px 12px;font:inherit;font-size:16px;cursor:pointer}
.polcard{background:#fbf8f1;padding:14px 14px 10px;border-radius:4px;box-shadow:0 14px 40px rgba(0,0,0,.55);transform:rotate(-3deg);width:min(86vw,60vh,420px);animation:pop .4s cubic-bezier(.2,1.4,.4,1);cursor:pointer;text-shadow:none}
.polcard img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#ddd5c6}
.polcap{margin:10px 0 2px;text-align:center;color:#3a352c;font-size:18px;letter-spacing:.5px}
.polcap small{color:#8b8374;font-size:12px}
@keyframes pop{from{transform:rotate(-12deg) scale(.6) translateY(40px);opacity:0}to{transform:rotate(-3deg);opacity:1}}
.fade{opacity:0;animation:f .8s forwards}
@keyframes f{to{opacity:1}}
</style></head>
<body>
<main>
 <h1 class="fade" style="animation-delay:.2s">mert<span class="at">@</span>portfolio<span class="cur"></span></h1>
 <p class="soon fade" style="animation-delay:.7s">coming soon</p>
 <p class="sub fade" style="animation-delay:1.1s">meanwhile, meet Tonti, the guard of this site</p>
 <p class="holiday fade" id="holiday" hidden style="animation-delay:1.3s"></p>
 <div class="links fade" style="animation-delay:1.5s">
  <a href="https://github.com/Piercies3sc">github</a>
  <a href="mailto:mertpural@gmail.com">email</a>
 </div>
</main>
<div class="hint" id="hint">pet Tonti 5 times · tap the bowls &amp; the box · drag &amp; throw the yarn</div>
<canvas id="c"></canvas>
<div id="bub"></div>
<div id="cnt" aria-label="pets">♥ 0</div>
<div id="tools"><button id="cam" aria-label="photos of Tonti" title="photos">📷</button><button id="mute" aria-label="sound on/off" title="sound">🔊</button></div>
<div id="pol" hidden role="dialog" aria-label="Tonti"><button id="polx" aria-label="close">✕</button><div class="polcard"><img id="polimg" alt="Tonti" decoding="async"><p class="polcap"><span>Tonti ♥</span> <small id="poln"></small></p></div></div>
<noscript><p style="position:fixed;bottom:12px;width:100%;text-align:center;color:#6e7681">enable JavaScript to meet the cat 🐱</p></noscript>
<script src="cat.js"></script>
</body></html>
